name: Publish verified editor release
on:
  push:
    branches: [maintenance/ghcr-cleanup]
    paths: [.github/workflows/publish-editor-fork-release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ericlvboy-dotcom/m3u-editor
        run: |
          set -euo pipefail
          gh release edit v0.14.6 --latest --notes-file - <<'NOTES'
          ## Live playlist output

          - Add, change, or clear a live group prefix in a regular playlist’s Output settings. The prefix applies when the playlist is generated.
          - Set live group and channel name casing independently. Choose Original, Uppercase, Title Case, or Lowercase.
          - Combine live groups that resolve to the same displayed name in regular and merged output, including groups from different source playlists. Keep every channel entry. M3U and Xtream use the resulting live group names.
          - Sort merged live groups A–Z and sort live channels A–Z within each group with separate switches under Merged Playlist → Output. Turning a switch off uses the existing order. Saved settings reload when the playlist is edited.
          - Remove the Channel Auto Sort, Group Auto Sort, Category Auto Sort, and Sort by channel number controls from regular playlist Output. The Manage Live Groups and Channels tabs show source playlists.

          ## Import and app fixes

          - Retain live and VOD Xtream entries when the provider omits the name. Use the supplied title or a fallback based on the stream ID.
          - Restore the Create Backup action on the admin Backups page.
          - Let the installed M3U TV web app follow the device orientation.
          - Point the editor’s update check, Releases links, and Release Logs at this fork. Keep upstream release cache data separate.
          - Update League CSV to 9.29.1 to resolve a Composer security advisory.

          ## Build and deployment

          - Run security, code quality, and Pest checks before publishing the AMD64 and ARM64 image. Verify the pushed registry digest.
          - Check upstream daily for changes.
          - Docker image: `ghcr.io/ericlvboy-dotcom/m3u-editor:latest`
          - Immutable image: `ghcr.io/ericlvboy-dotcom/m3u-editor@sha256:c05a766da0324634434d4eef27ab49a8b5150074d302582c9d912359ada2efe2`

          [Full fork diff](https://github.com/ericlvboy-dotcom/m3u-editor/compare/f5ae6de6c...a2971a6d9) · [Verified build](https://github.com/ericlvboy-dotcom/m3u-editor/actions/runs/45617053963)

          ## Deploy with Docker Compose or Portainer

          ### Update an existing Portainer stack

          Open **Stacks → your M3U Editor stack → Editor**. Replace only the `image:` line with the digest-pinned line below and click **Update the stack**. Keep the same stack name, environment variables, and volume mappings so the editor can find its existing PostgreSQL database and files.

          ```yaml
          image: ghcr.io/ericlvboy-dotcom/m3u-editor@sha256:c05a766da0324634434d4eef27ab49a8b5150074d302582c9d912359ada2efe2
          ```

          ### Fresh install on Docker Standalone

          In Portainer, choose **Stacks → Add stack → Web editor** and paste the Compose file below. Under **Environment variables**, set `APP_URL` to the address users will open, such as `http://192.168.1.10:36400`. Set separate strong values for `PG_PASSWORD` and `M3U_PROXY_TOKEN`, then select **Deploy the stack**.

          For Docker Compose on the command line, save the YAML as `compose.yaml` and set the same three variables in a `.env` file beside it. Run `docker compose up -d`, then use `docker compose ps` to check startup and `docker compose logs -f m3u-editor` to view logs. Open the URL you set once the container is healthy.

          ```yaml
          services:
            m3u-editor:
              image: ghcr.io/ericlvboy-dotcom/m3u-editor@sha256:c05a766da0324634434d4eef27ab49a8b5150074d302582c9d912359ada2efe2
              restart: unless-stopped
              ports:
                - "36400:36400"
              environment:
                TZ: ${TZ:-Etc/UTC}
                APP_URL: ${APP_URL:?Set the URL users will open}
                APP_PORT: "36400"
                ENABLE_POSTGRES: "true"
                POSTGRES_VERSION: "17"
                PG_DATABASE: m3ue
                PG_USER: m3ue
                PG_PASSWORD: ${PG_PASSWORD:?Set a database password}
                PG_PORT: "5432"
                DB_CONNECTION: pgsql
                DB_HOST: localhost
                DB_PORT: "5432"
                DB_DATABASE: m3ue
                DB_USERNAME: m3ue
                DB_PASSWORD: ${PG_PASSWORD:?Set a database password}
                REDIS_ENABLED: "true"
                REDIS_SERVER_PORT: "36790"
                REDIS_HOST: localhost
                REDIS_PASSWORD: ${M3U_PROXY_TOKEN:?Set a proxy token}
                M3U_PROXY_ENABLED: "true"
                M3U_PROXY_PORT: "38085"
                M3U_PROXY_HOST: localhost
                M3U_PROXY_TOKEN: ${M3U_PROXY_TOKEN:?Set a proxy token}
              volumes:
                - editor-config:/var/www/config
                - pgdata:/var/lib/postgresql/data
                - editor-storage:/var/www/html/storage/app/public
              healthcheck:
                test: ["CMD", "curl", "-f", "http://127.0.0.1:36400/up"]
                interval: 30s
                timeout: 10s
                retries: 5
                start_period: 60s

          volumes:
            editor-config:
            pgdata:
            editor-storage:
          ```

          [Portainer stack documentation](https://docs.portainer.io/user/docker/stacks/edit)
          NOTES
