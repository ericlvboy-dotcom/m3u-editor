name: Promote verified editor UI image
on:
  push:
    branches: [maintenance/ghcr-cleanup]
    paths: [.github/workflows/promote-editor-fork-ui.yml]
permissions:
  packages: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and verify the existing image
        env:
          IMAGE: ghcr.io/ericlvboy-dotcom/m3u-editor
          DIGEST: sha256:c05a766da0324634434d4eef27ab49a8b5150074d302582c9d912359ada2efe2
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest" | grep -Eq "^Digest:[[:space:]]+$DIGEST$"
